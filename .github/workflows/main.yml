name: Build Aseprite (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Aseprite (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prebuilt Skia (aseprite-m124)
        shell: pwsh
        run: |
          mkdir C:\deps
          curl.exe -L -o C:\deps\skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
          Expand-Archive -Path C:\deps\skia.zip -DestinationPath C:\deps\skia

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure (CMake)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia ^
            -DSKIA_DIR=C:\deps\skia ^
            -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 ^
            -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib ^
            -G Ninja ..

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd build
          ninja aseprite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-x64
          path: build/bin/
